name = "agentica-llm"

# Needs Agentica 0.19.0-beta.3 or later (Bond 0.4.0 does, for `HttpServerOptions` with field defaults).

# Prebuilt llama.cpp release (scripts/fetch-llama.sh). libllama.so finds
# libggml.so next to itself through RUNPATH=$ORIGIN.
[native.llama]
linux = { file = "native/linux/libllama.so.0" }

[native.ggml]
linux = { file = "native/linux/libggml.so.0" }

[dependencies]
bond = { git = "https://github.com/agentica-lang/bond", tag = "0.4.0" }
